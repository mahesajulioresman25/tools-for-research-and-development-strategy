    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function() {
        try {
          // Suppress benign Vite HMR websocket reconnection noise in sandboxed preview iframe
          window.addEventListener('unhandledrejection', function(event) {
            if (event && event.reason) {
              var msg = String(event.reason.message || event.reason);
              if (msg.includes('WebSocket') || msg.includes('vite') || msg.includes('ws://') || msg.includes('wss://')) {
                event.preventDefault();
                event.stopImmediatePropagation();
              }
            }
          });

          window.addEventListener('error', function(event) {
            if (event && (event.message || event.error)) {
              var msg = String(event.message || (event.error && event.error.message) || '');
              if (msg.includes('WebSocket') || msg.includes('vite') || msg.includes('ws://') || msg.includes('wss://')) {
                event.preventDefault();
                event.stopImmediatePropagation();
              }
            }
          }, true);

          var originalFetch = window.fetch;
          var desc = Object.getOwnPropertyDescriptor(window, 'fetch') ||
                     (window.constructor && window.constructor.prototype && Object.getOwnPropertyDescriptor(window.constructor.prototype, 'fetch'));
          if (!desc || !desc.writable || !desc.set) {
            var _fetch = originalFetch;
            try {
              Object.defineProperty(window, 'fetch', {
                get: function() { return _fetch; },
                set: function(fn) { _fetch = fn; },
                configurable: true,
                enumerable: true
              });
            } catch (e) {
              // ignore
            }
          }
        } catch (err) {
          // ignore
        }
      })();
    </script>
